<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="/src/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>examples</title>
    <style>
      twc-instance:nth-of-type(n) {
        --initial-transform: translateX(
          calc(10px * (sibling-index() - 1) - (10px * sibling-count() / 2))
        );

        animation-name: anim;
        animation-duration: 2s;
        animation-iteration-count: infinite;
        animation-direction: alternate;
        animation-delay: calc(0.1s * sibling-index());
        animation-fill-mode: both;
      }

      @keyframes anim {
        0% {
          transform: var(--initial-transform) translateY(calc(-50px));
        }

        100% {
          transform: var(--initial-transform) translateY(calc(50px));
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <div>
      <twc-renderer>
        <twc-scene>
          <twc-instanced-mesh style="color: white">
            <twc-box-geometry width="5" height="5" depth="5"></twc-box-geometry>
            <twc-basic-material></twc-basic-material>
            <twc-instance></twc-instance>
            <twc-instance></twc-instance>
            <twc-instance></twc-instance>
            <twc-instance></twc-instance>
            <twc-instance></twc-instance>
            <twc-instance></twc-instance>
            <twc-instance></twc-instance>
            <twc-instance></twc-instance>
            <twc-instance></twc-instance>
            <twc-instance></twc-instance>
          </twc-instanced-mesh>
          <twc-camera-controls radius="60">
            <twc-perspective-camera></twc-perspective-camera>
          </twc-camera-controls>
        </twc-scene>
        <twc-output>
          <canvas width="500px" height="300px"></canvas>
        </twc-output>
      </twc-renderer>
    </div>
  </body>
</html>
