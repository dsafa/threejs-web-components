<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="/src/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Commands example</title>
    <style>
      #content {
        display: flex;
        place-content: center;
      }

      #nav {
        display: grid;
        grid-template-areas:
          ". t ."
          "l m r"
          ". b .";
        min-width: 0;
        justify-content: center;
      }

      button {
        min-width: 0;
        width: 20ch;
      }

      .top {
        grid-area: t;
      }

      .left {
        grid-area: l;
      }

      .right {
        grid-area: r;
      }

      .bottom {
        grid-area: b;
      }

      .middle {
        grid-area: m;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
    <div id="content">
      <twc-renderer>
        <twc-scene>
          <twc-mesh>
            <twc-box-geometry width="5" height="5" depth="5"></twc-box-geometry>
            <twc-basic-material></twc-basic-material>
          </twc-mesh>
          <twc-camera-controls id="controls">
            <twc-perspective-camera></twc-perspective-camera>
          </twc-camera-controls>
        </twc-scene>
        <twc-output>
          <canvas width="500px" height="300px"></canvas>
        </twc-output>
      </twc-renderer>
    </div>
    <div id="nav">
      <div class="top">
        <button
          type="button"
          commandfor="controls"
          command="--rotate:polar=-20"
        >
          ⬆
        </button>
      </div>
      <div class="right">
        <button
          type="button"
          commandfor="controls"
          command="--rotate:azimuth=20"
        >
          ⮕
        </button>
      </div>
      <div class="bottom">
        <button type="button" commandfor="controls" command="--rotate:polar=20">
          ⬇
        </button>
      </div>
      <div class="left">
        <button
          type="button"
          commandfor="controls"
          command="--rotate:azimuth=-20"
        >
          ⬅
        </button>
      </div>
      <div class="middle">
        <button type="button" commandfor="controls" command="--fit">Fit</button>
      </div>
    </div>
  </body>
</html>
