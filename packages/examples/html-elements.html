<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixed html elements</title>
    <style>
      twc-mesh {
        color: white;
      }

      twc-mesh:state(hovered) {
        color: red;
        animation-name: rotate;
        animation-duration: 1s;
      }

      @keyframes rotate {
        0% {
          transform: translate3d(0px, 0px, 0px);
        }

        100% {
          transform: translate3d(100px, 0px, 0px);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <div>
      <twc-renderer>
        <twc-scene>
          <twc-mesh>
            <twc-box-geometry width="5" height="5" depth="5"></twc-box-geometry>
            <twc-basic-material></twc-basic-material>
            <twc-html>
              <div>Test</div>
            </twc-html>
          </twc-mesh>
          <twc-camera-controls>
            <twc-perspective-camera></twc-perspective-camera>
          </twc-camera-controls>
        </twc-scene>
        <twc-output>
          <canvas width="500px" height="300px"></canvas>
        </twc-output>
      </twc-renderer>
    </div>
  </body>
</html>
