<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="stylesheet" href="/src/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mixed html elements</title>
    <style>
      twc-html {
        color: initial;
      }

      #a {
        animation-name: anim;
        animation-duration: 2s;
        animation-iteration-count: infinite;
      }

      #a twc-html div {
        background-color: #eee;
        border-radius: 4px;
        border: 1px solid blue;
      }

      #b twc-html {
        visibility: hidden;
      }

      #b:state(selected) twc-html {
        visibility: visible;
      }

      #b div {
        background-color: #eee;
        border-radius: 4px;
        border: 1px solid blue;
      }

      @keyframes anim {
        0% {
          transform: translate3d(0px, 0px, 0px);
        }

        50% {
          transform: translate3d(10px, 0px, 0px);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <div>
      <twc-renderer>
        <twc-scene>
          <twc-mesh id="a">
            <twc-box-geometry width="5" height="5" depth="5"></twc-box-geometry>
            <twc-basic-material></twc-basic-material>
            <twc-html>
              <div>Html element</div>
            </twc-html>
          </twc-mesh>
          <twc-mesh id="b" position="[0, -20, 0]">
            <twc-box-geometry width="5" height="5" depth="5"></twc-box-geometry>
            <twc-basic-material></twc-basic-material>
            <twc-html>
              <div>Selected</div>
            </twc-html>
          </twc-mesh>
          <twc-camera-controls>
            <twc-perspective-camera></twc-perspective-camera>
          </twc-camera-controls>
        </twc-scene>
        <twc-output>
          <canvas width="500px" height="300px"></canvas>
        </twc-output>
      </twc-renderer>
    </div>
  </body>
</html>
