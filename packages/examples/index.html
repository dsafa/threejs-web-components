<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>examples</title>
    <style>
      twc-renderer:has(twc-camera-controls:state(rotate)) canvas {
        cursor: grabbing;
      }

      twc-renderer:has(twc-camera-controls:state(pan)) canvas {
        cursor: move;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <div>
      <twc-renderer>
        <twc-scene>
          <twc-mesh style="color: white">
            <twc-box-geometry width="5" height="5" depth="5"></twc-box-geometry>
            <twc-basic-material></twc-basic-material>
          </twc-mesh>
          <twc-camera-controls>
            <twc-perspective-camera></twc-perspective-camera>
          </twc-camera-controls>
        </twc-scene>
        <twc-output>
          <canvas width="500px" height="300px"></canvas>
        </twc-output>
      </twc-renderer>
    </div>
  </body>
</html>
